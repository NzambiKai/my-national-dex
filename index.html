<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12b5a8">
    <title>National Living Dex</title>
    <meta name="description" content="A Pokémon HOME style National Living Dex. Browse 6×5 boxes, jump from search to the exact slot, and see which Nintendo Switch games each Pokémon can be caught in.">
    <link rel="icon" href="./assets/icons/favicon.ico" sizes="any">
    <link rel="icon" href="./assets/icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="./assets/icons/icon-192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="./assets/icons/icon-512.png" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" sizes="180x180">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/app.css">
  </head>
  <body>
    <a class="visually-hidden-focusable skip-link" href="#box-root">Skip to the current box</a>
    <header class="home-header">
      <div class="container-xxl header-inner">
        <div class="brand">
          <img class="brand-mark" src="./assets/icons/icon-512.png" width="46" height="46" alt="">
          <h1>National Living Dex</h1>
        </div>
      </div>
    </header>

    <main class="container-xxl app-shell">
      <div id="app-error" class="alert alert-danger" role="alert" hidden></div>
      <div id="progress-root" aria-live="polite"></div>
      <div class="row g-4 align-items-center toolbar">
        <div class="col-xl-8" id="strip-root"></div>
        <div class="col-xl-4 search-wrap" id="search-wrap">
          <label class="visually-hidden" for="search-input">Search by Pokémon name or Dex number</label>
          <div class="search-field">
            <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"></circle>
              <path d="M16 16.5 20 20.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
            </svg>
            <input id="search-input" class="form-control" type="search" placeholder="Search name or Dex number" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results">
          </div>
          <div id="search-results" class="search-results" hidden></div>
        </div>
      </div>
      <div class="row g-4 align-items-start">
        <div class="col-xl-8" id="box-root">
          <p class="loading-copy">Loading the Living Dex…</p>
        </div>
        <div class="col-xl-4 d-none d-xl-block">
          <aside id="detail-desktop" class="detail-card" aria-live="polite"></aside>
        </div>
      </div>
    </main>

    <div class="offcanvas offcanvas-end detail-offcanvas" tabindex="-1" id="detail-offcanvas" aria-labelledby="detail-offcanvas-title">
      <div class="offcanvas-header">
        <h2 class="offcanvas-title" id="detail-offcanvas-title">Pokémon</h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close details"></button>
      </div>
      <div class="offcanvas-body" id="detail-offcanvas-body"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
